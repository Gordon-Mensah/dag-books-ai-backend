<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DAG BOOKS AI — Ask a Question</title>

  <style>
    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      background: #0d0d0d;
      color: #e6e6e6;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* SIDEBAR */
    .sidebar {
      width: 260px;
      background: #111;
      border-right: 1px solid #222;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .logo {
      font-size: 1.3rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 10px;
    }

    .sidebar button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .sidebar button:hover {
      opacity: 0.9;
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      border-top: 1px solid #222;
      padding-top: 15px;
    }

    .chat-item {
      padding: 12px;
      border-radius: 8px;
      background: #1a1a1a;
      border: 1px solid #222;
      margin-bottom: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    .chat-item:hover {
      background: #222;
    }

    .help-box {
      background: #1a1a1a;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    /* MAIN AREA */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    /* NAVBAR */
    .navbar {
      display: flex;
      justify-content: flex-end;
      gap: 20px;
      margin-bottom: 20px;
    }

    .navbar a {
      color: #bbb;
      text-decoration: none;
      font-size: 1rem;
      transition: 0.2s;
    }

    .navbar a:hover {
      color: #fff;
    }

    .navbar a.active {
      color: #7c3aed;
      font-weight: 600;
    }

    /* SELECTORS + SUMMARY */
    .top-row {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }

    .selectors {
      flex: 1;
      display: flex;
      gap: 10px;
    }

    select {
      flex: 1;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #e6e6e6;
      font-size: 1rem;
    }

    /* Chapter dropdown hidden for now */
    #chapterSelect {
      display: none;
    }

    .book-summary {
      flex: 1;
      background: #111;
      border-radius: 12px;
      border: 1px solid #222;
      padding: 14px;
      font-size: 0.95rem;
      color: #ccc;
      line-height: 1.5;
    }

    .book-summary h3 {
      margin: 0 0 8px 0;
      font-size: 1rem;
      color: #fff;
    }

    /* CHAT WINDOW */
    .chat-window {
      background: #111;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 20px;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* CHAT BUBBLES */
    .bubble {
      max-width: 80%;
      padding: 14px 18px;
      border-radius: 12px;
      line-height: 1.6;
      font-size: 1rem;
      white-space: pre-wrap;
    }

    .user {
      align-self: flex-end;
      background: #4f46e5;
      color: white;
      border-bottom-right-radius: 0;
    }

    .ai {
      align-self: flex-start;
      background: #1a1a1a;
      border: 1px solid #333;
      border-bottom-left-radius: 0;
    }

    .typing {
      font-size: 0.9rem;
      color: #aaa;
      font-style: italic;
    }

    /* INPUT AREA */
    .input-area {
      display: flex;
      margin-top: 20px;
      gap: 10px;
    }

    textarea {
      flex: 1;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #e6e6e6;
      font-size: 1rem;
      height: 60px;
      resize: none;
    }

    button.send {
      padding: 14px 20px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    button.send:hover {
      opacity: 0.9;
    }

    /* RECOMMENDED BOOKS */
    .recommended-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }

    .rec-card {
      background: #111;
      border: 1px solid #222;
      padding: 14px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
      font-size: 0.9rem;
      text-align: left;
    }

    .rec-card:hover {
      background: #222;
    }

    .rec-card h4 {
      margin: 0 0 6px 0;
      font-size: 1rem;
      color: #fff;
    }

    .rec-card p {
      margin: 0;
      color: #bbb;
      line-height: 1.4;
    }
  </style>
</head>

<body>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="logo">DAG BOOKS AI</div>

    <button onclick="newChat()">+ New Chat</button>

    <div class="chat-list" id="chatList"></div>

    <div class="help-box">
      <strong>How to use:</strong><br><br>
      1. Select a book.<br>
      2. Ask any question.<br>
      3. AI answers using ONLY that book.<br>
      4. Chats are saved automatically.
    </div>
  </div>

  <!-- MAIN AREA -->
  <div class="main">

    <!-- NAVBAR -->
    <div class="navbar">
      <a href="/home">Home</a>
      <a href="/finder">Find Book</a>
      <a href="/ask" class="active">Ask Question</a>
    </div>

    <!-- SELECTORS + SUMMARY -->
    <div class="top-row">
      <div class="selectors">
        <select id="bookSelect"></select>
        <select id="chapterSelect"></select> <!-- Hidden for now -->
      </div>

      <div class="book-summary" id="bookSummary">
        <h3>Book summary</h3>
        <p>Select a book to see a short summary of what it covers.</p>
      </div>
    </div>

    <!-- CHAT WINDOW -->
    <div class="chat-window" id="chatWindow"></div>

    <!-- RECOMMENDED BOOKS -->
    <div id="recommendedSection" style="margin-top: 20px;">
      <h3 style="margin-bottom:10px; font-size:1rem; font-weight:600; color:#fff;">
        Recommended next reads
      </h3>
      <div id="recommendedBooks" class="recommended-grid"></div>
    </div>

    <!-- INPUT AREA -->
    <div class="input-area">
      <textarea id="questionInput" placeholder="Ask something about this book..."></textarea>
      <button class="send" onclick="sendQuestion()">Send</button>
    </div>

  </div>

  <script>
    /* ----------------------------------------
       BACKEND URL (auto-switch local/Render)
    ---------------------------------------- */
    const API_BASE =
      window.location.hostname === "localhost" ||
      window.location.hostname === "127.0.0.1"
        ? "http://127.0.0.1:8000"
        : window.location.origin;

    /* ----------------------------------------
       CHAT HISTORY
    ---------------------------------------- */
    let chats = JSON.parse(localStorage.getItem("chats") || "{}");
    let currentChatId = null;

    function saveChats() {
      localStorage.setItem("chats", JSON.stringify(chats));
    }

    function newChat() {
      currentChatId = "chat_" + Date.now();
      chats[currentChatId] = {
        book: getSelectedBook(),
        messages: []
      };
      saveChats();
      loadChatList();
      clearChatWindow();
    }

    function loadChatList() {
      const list = document.getElementById("chatList");
      list.innerHTML = "";

      Object.entries(chats).forEach(([id, chat]) => {
        const div = document.createElement("div");
        div.className = "chat-item";
        const title = chat.book || "No book selected";
        const lastMsg = chat.messages[chat.messages.length - 1];
        const preview = lastMsg ? lastMsg.content.slice(0, 40) + "..." : "New conversation";
        div.innerHTML = `<strong>${title}</strong><br><span style="font-size:0.85rem;color:#aaa;">${preview}</span>`;
        div.onclick = () => loadChat(id);
        list.appendChild(div);
      });
    }

    function loadChat(id) {
      currentChatId = id;
      const chat = chats[id];
      if (chat.book) {
        setSelectedBook(chat.book);
      }
      clearChatWindow();
      chat.messages.forEach(msg => addMessage(msg.role, msg.content, false));
    }

    function clearChatWindow() {
      document.getElementById("chatWindow").innerHTML = "";
    }

    function addMessage(role, content, save = true) {
      const chatWindow = document.getElementById("chatWindow");
      const div = document.createElement("div");
      div.className = `bubble ${role === "user" ? "user" : "ai"}`;
      div.textContent = content;
      chatWindow.appendChild(div);
      chatWindow.scrollTop = chatWindow.scrollHeight;

      if (save) {
        if (!currentChatId) {
          newChat();
        }
        chats[currentChatId].book = getSelectedBook();
        chats[currentChatId].messages.push({ role, content });
        saveChats();
        loadChatList();
      }
    }

    function showTypingIndicator() {
      const chatWindow = document.getElementById("chatWindow");
      let typing = document.getElementById("typingIndicator");
      if (!typing) {
        typing = document.createElement("div");
        typing.id = "typingIndicator";
        typing.className = "bubble ai typing";
        typing.textContent = "Thinking...";
        chatWindow.appendChild(typing);
      }
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function removeTypingIndicator() {
      const typing = document.getElementById("typingIndicator");
      if (typing) typing.remove();
    }

    /* ----------------------------------------
       BOOKS + SUMMARIES + RECOMMENDED
    ---------------------------------------- */

    async function loadBooks() {
      try {
        const res = await fetch(`${API_BASE}/books`);
        const data = await res.json();
        const select = document.getElementById("bookSelect");
        select.innerHTML = `<option value="">Select a book...</option>`;

        data.books.forEach(book => {
          const option = document.createElement("option");
          option.value = book.title;
          option.textContent = book.title;
          option.dataset.summary = book.summary || "";
          select.appendChild(option);
        });

        // If URL has ?book=, preselect
        const urlParams = new URLSearchParams(window.location.search);
        const bookFromUrl = urlParams.get("book");
        if (bookFromUrl) {
          setSelectedBook(bookFromUrl);
        } else if (data.books.length > 0) {
          setSelectedBook(data.books[0].title);
        }

        updateBookSummary();
        loadRecommendedForCurrentBook();
      } catch (err) {
        console.error("Failed to load books:", err);
      }
    }

    function getSelectedBook() {
      const select = document.getElementById("bookSelect");
      return select.value || "";
    }

    function setSelectedBook(title) {
      const select = document.getElementById("bookSelect");
      Array.from(select.options).forEach(opt => {
        if (opt.value === title) {
          opt.selected = true;
        }
      });
      updateBookSummary();
      loadRecommendedForCurrentBook();
    }

    function updateBookSummary() {
      const select = document.getElementById("bookSelect");
      const summaryBox = document.getElementById("bookSummary");
      const selected = select.selectedOptions[0];

      if (selected && selected.value) {
        const summary = selected.dataset.summary || "No summary available for this book yet.";
        summaryBox.innerHTML = `
          <h3>${selected.value}</h3>
          <p>${summary}</p>
        `;
      } else {
        summaryBox.innerHTML = `
          <h3>Book summary</h3>
          <p>Select a book to see a short summary of what it covers.</p>
        `;
      }
    }

    async function loadRecommendedForCurrentBook() {
      const book = getSelectedBook();
      const container = document.getElementById("recommendedBooks");
      if (!book) {
        container.innerHTML = "";
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/recommended/${encodeURIComponent(book)}`);
        const data = await res.json();
        container.innerHTML = "";

        if (!data.recommended || data.recommended.length === 0) {
          container.innerHTML = `<span style="font-size:0.9rem;color:#888;">No recommendations available yet.</span>`;
          return;
        }

        data.recommended.forEach(title => {
          const card = document.createElement("div");
          card.className = "rec-card";
          card.innerHTML = `
            <h4>${title}</h4>
            <p>Tap to switch to this book and ask follow‑up questions.</p>
          `;
          card.onclick = () => {
            setSelectedBook(title);
          };
          container.appendChild(card);
        });
      } catch (err) {
        console.error("Failed to load recommended books:", err);
      }
    }

    document.getElementById("bookSelect").addEventListener("change", () => {
      updateBookSummary();
      loadRecommendedForCurrentBook();
    });

    /* ----------------------------------------
       SEND QUESTION (STREAMING)
    ---------------------------------------- */

    async function sendQuestion() {
      const questionInput = document.getElementById("questionInput");
      const question = questionInput.value.trim();
      const book = getSelectedBook();

      if (!book) {
        alert("Please select a book first.");
        return;
      }
      if (!question) {
        return;
      }

      addMessage("user", question);
      questionInput.value = "";

      showTypingIndicator();

      try {
        const res = await fetch(`${API_BASE}/ask`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question, book })
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let aiMessage = "";
        let aiBubble = null;

        removeTypingIndicator();

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value);
          aiMessage += chunk;

          if (!aiBubble) {
            aiBubble = document.createElement("div");
            aiBubble.className = "bubble ai";
            aiBubble.textContent = "";
            document.getElementById("chatWindow").appendChild(aiBubble);
          }

          aiBubble.textContent = aiMessage;
          const chatWindow = document.getElementById("chatWindow");
          chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        if (aiMessage) {
          if (!currentChatId) newChat();
          chats[currentChatId].book = getSelectedBook();
          chats[currentChatId].messages.push({ role: "assistant", content: aiMessage });
          saveChats();
          loadChatList();
        }

      } catch (err) {
        removeTypingIndicator();
        console.error("Error calling /ask:", err);
        addMessage("assistant", "Sorry, something went wrong while contacting the server.");
      }
    }

    /* ----------------------------------------
       INITIAL LOAD
    ---------------------------------------- */

    loadChatList();
    loadBooks();

    if (Object.keys(chats).length === 0) {
      newChat();
      addMessage(
        "assistant",
        "Welcome! Select a book and ask any question. I’ll answer using ONLY that book."
      );
    }
  </script>

</body>
</html>
