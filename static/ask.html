<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DAG BOOKS AI — Ask a Question</title>

  <style>
    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      background: #0d0d0d;
      color: #e6e6e6;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* SIDEBAR */
    .sidebar {
      width: 260px;
      background: #111;
      border-right: 1px solid #222;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .logo {
      font-size: 1.3rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 10px;
    }

    .sidebar button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .sidebar button:hover {
      opacity: 0.9;
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      border-top: 1px solid #222;
      padding-top: 15px;
    }

    .chat-item {
      padding: 12px;
      border-radius: 8px;
      background: #1a1a1a;
      border: 1px solid #222;
      margin-bottom: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    .chat-item:hover {
      background: #222;
    }

    .help-box {
      background: #1a1a1a;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    /* MAIN AREA */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    /* NAVBAR */
    .navbar {
      display: flex;
      justify-content: flex-end;
      gap: 20px;
      margin-bottom: 20px;
    }

    .navbar a {
      color: #bbb;
      text-decoration: none;
      font-size: 1rem;
      transition: 0.2s;
    }

    .navbar a:hover {
      color: #fff;
    }

    .navbar a.active {
      color: #7c3aed;
      font-weight: 600;
    }

    /* SELECTORS */
    .selectors {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }

    select {
      flex: 1;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #e6e6e6;
      font-size: 1rem;
    }

    /* CHAT WINDOW */
    .chat-window {
      background: #111;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 20px;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* CHAT BUBBLES */
    .bubble {
      max-width: 80%;
      padding: 14px 18px;
      border-radius: 12px;
      line-height: 1.6;
      font-size: 1rem;
      white-space: pre-wrap;
    }

    .user {
      align-self: flex-end;
      background: #4f46e5;
      color: white;
      border-bottom-right-radius: 0;
    }

    .ai {
      align-self: flex-start;
      background: #1a1a1a;
      border: 1px solid #333;
      border-bottom-left-radius: 0;
    }

    /* INPUT AREA */
    .input-area {
      display: flex;
      margin-top: 20px;
      gap: 10px;
    }

    textarea {
      flex: 1;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #e6e6e6;
      font-size: 1rem;
      height: 60px;
      resize: none;
    }

    button.send {
      padding: 14px 20px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    button.send:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="logo">DAG BOOKS AI</div>

    <button onclick="newChat()">+ New Chat</button>

    <div class="chat-list" id="chatList"></div>

    <div class="help-box">
      <strong>How to use:</strong><br><br>
      1. Select a book & chapter.<br>
      2. Ask any question.<br>
      3. AI answers using ONLY that chapter.<br>
      4. Chats are saved automatically.
    </div>
  </div>

  <!-- MAIN AREA -->
  <div class="main">

    <!-- NAVBAR -->
    <div class="navbar">
      <a href="/home">Home</a>
      <a href="/finder">Find Book</a>
      <a href="/ask" class="active">Ask Question</a>
    </div>

    <!-- SELECTORS -->
    <div class="selectors">
      <select id="book"></select>
      <select id="chapter"></select>
    </div>

    <!-- CHAT WINDOW -->
    <div class="chat-window" id="chat"></div>

    <!-- INPUT AREA -->
    <div class="input-area">
      <textarea id="question" placeholder="Ask something about this chapter..."></textarea>
      <button class="send" onclick="sendMessage()">Send</button>
    </div>

  </div>

  <script>
    /* ----------------------------------------
       BACKEND URL (auto-switch local/Render)
    ---------------------------------------- */

    const API_BASE =
      window.location.hostname === "localhost" ||
      window.location.hostname === "127.0.0.1"
        ? "http://127.0.0.1:8000"
        : "https://dagbooks-ai.onrender.com";

    /* ------------------------------
       CHAT HISTORY SYSTEM
    ------------------------------ */

    let chats = JSON.parse(localStorage.getItem("chats") || "{}");
    let currentChatId = null;

    function saveChats() {
      localStorage.setItem("chats", JSON.stringify(chats));
    }

    function newChat() {
      currentChatId = "chat_" + Date.now();
      chats[currentChatId] = {
        title: "New Chat",
        messages: []
      };
      saveChats();
      loadChatList();
      loadChat(currentChatId);
    }

    function loadChatList() {
      const list = document.getElementById("chatList");
      list.innerHTML = "";

      Object.entries(chats).forEach(([id, chat]) => {
        const div = document.createElement("div");
        div.className = "chat-item";
        div.textContent = chat.title || "Untitled Chat";
        div.onclick = () => loadChat(id);
        list.appendChild(div);
      });
    }

    function loadChat(id) {
      currentChatId = id;
      const chatWindow = document.getElementById("chat");
      chatWindow.innerHTML = "";

      chats[id].messages.forEach(msg => {
        addBubble(msg.content, msg.role);
      });

      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function addBubble(text, sender) {
      const chatWindow = document.getElementById("chat");
      const div = document.createElement("div");
      div.className = `bubble ${sender}`;
      div.textContent = text;
      chatWindow.appendChild(div);
      chatWindow.scrollTop = chatWindow.scrollHeight;
      return div;
    }

    /* ------------------------------
       BOOK + CHAPTER LOADING
    ------------------------------ */

    const params = new URLSearchParams(window.location.search);
    const preselectedBook = params.get("book");

    async function loadBooks() {
      const res = await fetch(`${API_BASE}/books`);
      const data = await res.json();
      const select = document.getElementById("book");

      data.books.forEach(book => {
        const option = document.createElement("option");
        option.value = book;
        option.textContent = book;
        select.appendChild(option);
      });

      if (preselectedBook) {
        select.value = preselectedBook;
        loadChapters(preselectedBook);
      }
    }

    async function loadChapters(book) {
      const chapterSelect = document.getElementById("chapter");
      chapterSelect.innerHTML = "";

      const res = await fetch(`${API_BASE}/chapters/${encodeURIComponent(book)}`);
      const data = await res.json();

      data.chapters.forEach(ch => {
        const option = document.createElement("option");
        option.value = ch;
        option.textContent = ch;
        chapterSelect.appendChild(option);
      });
    }

    document.getElementById("book").addEventListener("change", () => {
      loadChapters(document.getElementById("book").value);
    });

    /* ------------------------------
       SEND MESSAGE + STREAMING
    ------------------------------ */

    async function sendMessage() {
      const book = document.getElementById("book").value;
      const chapter = document.getElementById("chapter").value;
      const question = document.getElementById("question").value;

      if (!question.trim()) return;

      // Create chat if none exists
      if (!currentChatId) newChat();

      // Add user bubble
      addBubble(question, "user");
      chats[currentChatId].messages.push({ role: "user", content: question });
      chats[currentChatId].title = question.slice(0, 30);
      saveChats();
      loadChatList();

      document.getElementById("question").value = "";

      // Add empty AI bubble for streaming
      const aiBubble = addBubble("", "ai");

      const res = await fetch(`${API_BASE}/ask`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, book, chapter })
      });

      const reader = res.body.getReader();
      const decoder = new TextDecoder("utf-8");
      let result = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        const chunk = decoder.decode(value);

        for (let char of chunk) {
          result += char;
          aiBubble.textContent = result;
          document.getElementById("chat").scrollTop =
            document.getElementById("chat").scrollHeight;
          await new Promise(r => setTimeout(r, 8));
        }
      }

      chats[currentChatId].messages.push({ role: "ai", content: result });
      saveChats();
    }

    /* ------------------------------
       INITIAL LOAD
    ------------------------------ */

    loadBooks();
    loadChatList();

    if (Object.keys(chats).length === 0) {
      newChat();
      addBubble(
        "Welcome! Select a book and chapter, then ask any question. I'll answer using ONLY that chapter.",
        "ai"
      );
      chats[currentChatId].messages.push({
        role: "ai",
        content:
          "Welcome! Select a book and chapter, then ask any question. I'll answer using ONLY that chapter."
      });
      saveChats();
    }
  </script>
</body>
</html>
