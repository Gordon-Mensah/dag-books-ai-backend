<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DAG BOOKS AI — Book Finder</title>

  <style>
    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      background: #0d0d0d;
      color: #e6e6e6;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* SIDEBAR */
    .sidebar {
      width: 260px;
      background: #111;
      border-right: 1px solid #222;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .logo {
      font-size: 1.3rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 10px;
    }

    .sidebar button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .sidebar button:hover {
      opacity: 0.9;
    }

    .search-list {
      flex: 1;
      overflow-y: auto;
      border-top: 1px solid #222;
      padding-top: 15px;
    }

    .search-item {
      padding: 12px;
      border-radius: 8px;
      background: #1a1a1a;
      border: 1px solid #222;
      margin-bottom: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    .search-item:hover {
      background: #222;
    }

    .help-box {
      background: #1a1a1a;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    /* MAIN AREA */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      overflow-y: auto;
    }

    /* NAVBAR */
    .navbar {
      display: flex;
      justify-content: flex-end;
      gap: 20px;
      margin-bottom: 20px;
    }

    .navbar a {
      color: #bbb;
      text-decoration: none;
      font-size: 1rem;
      transition: 0.2s;
    }

    .navbar a:hover {
      color: #fff;
    }

    .navbar a.active {
      color: #7c3aed;
      font-weight: 600;
    }

    /* PAGE TITLE */
    h1 {
      font-weight: 600;
      font-size: 1.8rem;
      margin-bottom: 20px;
      color: #ffffff;
      text-align: left;
    }

    /* INPUT */
    textarea {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #e6e6e6;
      font-size: 1rem;
      height: 100px;
    }

    button.find {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    button.find:hover {
      opacity: 0.9;
    }

    /* RESULTS */
    #results div {
      margin-top: 15px;
      padding: 15px;
      background: #1a1a1a;
      border-radius: 10px;
      border: 1px solid #333;
      cursor: pointer;
      transition: 0.2s;
    }

    #results div:hover {
      background: #222;
    }

    .highlight {
      background: #7c3aed;
      padding: 2px 4px;
      border-radius: 4px;
      color: white;
    }

    /* RECOMMENDED BOOKS */
    .recommended-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 10px;
    }

    .rec-card {
      background: #1a1a1a;
      border: 1px solid #222;
      padding: 20px;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .rec-card:hover {
      background: #222;
    }

    .rec-card h3 {
      margin: 0 0 10px 0;
      font-size: 1.1rem;
      color: #fff;
    }

    .rec-card p {
      color: #bbb;
      font-size: 0.95rem;
      line-height: 1.4;
    }
  </style>
</head>

<body>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="logo">DAG BOOKS AI</div>

    <button onclick="newSearch()">+ New Search</button>

    <div class="search-list" id="searchList"></div>

    <div class="help-box">
      <strong>How to use:</strong><br><br>
      1. Type a topic (e.g. humility).<br>
      2. See matching books.<br>
      3. Click a result to open chat.<br>
      4. Searches are saved automatically.
    </div>
  </div>

  <!-- MAIN AREA -->
  <div class="main">

    <!-- NAVBAR -->
    <div class="navbar">
      <a href="/home">Home</a>
      <a href="/finder" class="active">Find Book</a>
      <a href="/ask">Ask Question</a>
    </div>

    <h1>Book Finder</h1>

    <textarea id="query" placeholder="Which book talks about humility?"></textarea>

    <button class="find" onclick="findBook()">Find Book</button>

    <div id="results"></div>

    <!-- RECOMMENDED BOOKS -->
    <h2 style="margin-top:40px; margin-bottom:20px; font-size:1.4rem; font-weight:600; color:#fff;">
      Recommended Books
    </h2>

    <div id="recommended" class="recommended-grid"></div>

  </div>

  <script>
    /* ----------------------------------------
       BACKEND URL (auto-switch local/Render)
    ---------------------------------------- */

    const API_BASE =
      window.location.hostname === "localhost" ||
      window.location.hostname === "127.0.0.1"
        ? "http://127.0.0.1:8000"
        : window.location.origin;

    /* ------------------------------
       SEARCH HISTORY SYSTEM
    ------------------------------ */

    let searches = JSON.parse(localStorage.getItem("searches") || "{}");
    let currentSearchId = null;

    function saveSearches() {
      localStorage.setItem("searches", JSON.stringify(searches));
    }

    function newSearch() {
      currentSearchId = "search_" + Date.now();
      searches[currentSearchId] = {
        query: "",
        results: []
      };
      saveSearches();
      loadSearchList();
      document.getElementById("query").value = "";
      document.getElementById("results").innerHTML = "";
    }

    function loadSearchList() {
      const list = document.getElementById("searchList");
      list.innerHTML = "";

      Object.entries(searches).forEach(([id, search]) => {
        const div = document.createElement("div");
        div.className = "search-item";
        div.textContent = search.query || "Untitled Search";
        div.onclick = () => loadSearch(id);
        list.appendChild(div);
      });
    }

    function loadSearch(id) {
      currentSearchId = id;
      const search = searches[id];

      document.getElementById("query").value = search.query;
      renderResults(search.results);
    }

    /* ------------------------------
       SEARCH HIGHLIGHTING
    ------------------------------ */

    function highlight(text, query) {
      if (!query) return text;
      const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const regex = new RegExp(`(${escaped})`, "gi");
      return text.replace(regex, '<span class="highlight">$1</span>');
    }

    /* ------------------------------
       RENDER RESULTS
    ------------------------------ */

    function renderResults(results) {
      const resultsBox = document.getElementById("results");
      resultsBox.innerHTML = "";

      results.forEach(match => {
        const div = document.createElement("div");
        div.innerHTML = `
          <strong>${match.book}</strong><br><br>
          <em>${highlight(match.excerpt, searches[currentSearchId].query)}</em>
        `;
        div.onclick = () => {
          window.location.href = `/ask?book=${encodeURIComponent(match.book)}`;
        };
        resultsBox.appendChild(div);
      });
    }

    /* ------------------------------
       FIND BOOK
    ------------------------------ */

    async function findBook() {
      const query = document.getElementById("query").value;
      const resultsBox = document.getElementById("results");
      resultsBox.innerHTML = "Searching...";

      if (!currentSearchId) newSearch();

      searches[currentSearchId].query = query;

      const res = await fetch(`${API_BASE}/find-book`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query })
      });

      const data = await res.json();

      searches[currentSearchId].results = data.matches;
      saveSearches();
      loadSearchList();

      renderResults(data.matches);
    }

    /* ------------------------------
       DYNAMIC RECOMMENDED BOOKS
    ------------------------------ */

    async function loadRecommended() {
      const res = await fetch(`${API_BASE}/books`);
      const data = await res.json();

      const container = document.getElementById("recommended");
      container.innerHTML = "";

      data.books.slice(0, 4).forEach(book => {
        const card = document.createElement("div");
        card.className = "rec-card";

        card.innerHTML = `
          <h3>${book.title}</h3>
          <p>${book.summary}</p>
        `;

        card.onclick = () => {
          window.location.href = `/ask?book=${encodeURIComponent(book.title)}`;
        };

        container.appendChild(card);
      });
    }

    /* ------------------------------
       INITIAL LOAD
    ------------------------------ */

    loadSearchList();
    loadRecommended();

    if (Object.keys(searches).length === 0) {
      newSearch();
    }
  </script>

</body>
</html>
